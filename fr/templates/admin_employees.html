<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin - Employees</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap');
        :root {
            --bg: #e8edf5;
            --panel: #ffffff;
            --stroke: #e5e9f0;
            --primary: #2563ff;
            --accent: #16a34a;
            --text: #0f172a;
            --muted: #65748b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 18px;
            font-family: 'Manrope', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 20%, #f5f7fb, #e5ebf7 48%, #e8eefc);
            color: var(--text);
        }
        .shell { max-width: 980px; margin: 0 auto; }
        .panel {
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: 18px;
            padding: 26px 32px;
            box-shadow: 0 18px 55px rgba(15, 23, 42, 0.08);
        }
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 12px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #1f2937;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .badge {
            padding: 8px 12px;
            border-radius: 999px;
            background: #ecfdf3;
            color: var(--accent);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.2px;
        }
        .eyebrow {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 6px 0 2px 0;
        }
        h1 {
            margin: 6px 0;
            font-size: 28px;
            letter-spacing: -0.02em;
        }
        .sub { color: var(--muted); margin-bottom: 18px; }
        .emp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 10px;
        }
        .emp-card {
            display: block;
            padding: 16px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ecfdf3, #e5f7ec);
            border: 1px solid #d7f1df;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.01em;
            transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
        }
        .emp-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(34, 197, 94, 0.15);
            border-color: #bde7c9;
        }
        .emp-card span {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }
        .empty {
            padding: 28px;
            border: 1px dashed var(--stroke);
            border-radius: 12px;
            text-align: center;
            color: var(--muted);
            background: #f9fbff;
        }
    </style>
</head>
<body>

<div class="shell">
    <div class="panel">
        <div class="nav">
            <a href="/admin-panel/" class="back-btn">&larr; Back to Offices</a>
            <span class="badge">{{ office }}</span>
        </div>

        <div class="header">
            <div class="eyebrow">Roster</div>
            <h1>Employees in {{ office }}</h1>
            <p class="sub">Pick an employee to view their attendance history and confidence trend.</p>
        </div>

        {% if employees %}
        <div class="emp-grid">
            {% for e in employees %}
            <a href="/admin-panel/{{ office }}/{{ e }}/" class="emp-card">
                {{ e }}
                <span>View logs</span>
            </a>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty">No employees logged yet for {{ office }}.</div>
        {% endif %}
    </div>
</div>

</body>
</html>
