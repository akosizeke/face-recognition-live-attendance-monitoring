<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Face Recognition System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap');
    :root {
      --bg: #eef2f8;
      --panel: #ffffff;
      --surface: #f5f7fb;
      --stroke: #e5e9f0;
      --primary: #2563eb;
      --accent: #0ea5e9;
      --success: #16a34a;
      --warning: #f97316;
      --ink: #0f172a;
      --muted: #64748b;
      --sidebar-width: 320px;
      --sidebar-transition: 0.35s ease;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 12% 18%, #f5f7fb, #e7edf8 52%, #e1e7f3 100%);
      color: var(--ink);
      font-family: 'Manrope', 'Segoe UI', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      width: 100%;
      height: 100vh;
      transition: grid-template-columns var(--sidebar-transition);
    }
    body.sidebar-collapsed .layout {
      grid-template-columns: 0 1fr;
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--stroke);
      padding: 18px 20px;
      position: relative;
      overflow: visible;
      transition: transform var(--sidebar-transition), opacity 0.25s ease;
      box-shadow: 10px 0 32px rgba(15, 23, 42, 0.08);
      z-index: 15;
    }
    body.sidebar-collapsed .sidebar {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .sidebar__header {
      padding: 6px 2px 10px;
    }
    .gov-logos {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .gov-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }
    .sidebar__header .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin: 0 0 6px 0;
    }
    .sidebar__header h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.01em;
      color: #0b1a2f;
    }
    .sidebar__header p {
      margin: 6px 0 0 0;
      color: var(--muted);
      font-weight: 600;
      line-height: 1.4;
    }
    .sidebar__scroll {
      overflow: visible;
      height: calc(100vh - 90px);
      padding-right: 6px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    label {
      font-weight: 600;
      color: var(--muted);
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
    }
    .tip {
      position: relative;
    }
    .tip::after, .tip::before {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      z-index: 200;
    }
    .tip::after {
      content: attr(data-tip);
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translate(-50%, 6px);
      background: #0f172a;
      color: #fff;
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.24);
      max-width: 240px;
      white-space: normal;
      line-height: 1.35;
    }
    .tip::before {
      content: "";
      bottom: calc(100% + 2px);
      left: 50%;
      transform: translate(-50%, 8px);
      border: 7px solid transparent;
      border-bottom-color: #0f172a;
    }
    .tip:hover::after, .tip:focus-within::after,
    .tip:hover::before, .tip:focus-within::before {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: box-shadow .15s, border-color .15s, background .15s;
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
      background: rgba(255, 255, 255, 0.06);
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0 10px;
    }
    .btn {
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(2,6,23,0.18);
      transition: transform .08s ease, box-shadow .12s ease, opacity .12s ease;
      width: 100%;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary { background: var(--primary); }
    .btn.success { background: var(--success); }
    .btn.accent { background: var(--accent); }
    .btn.live { background: #6f42c1; }
    .btn.warn { background: var(--warning); }
    .btn.ghost {
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      box-shadow:none;
      border:1px solid var(--stroke);
    }
    .admin-row {
      margin: 8px 0 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .log {
      background: var(--surface);
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--stroke);
      color: #0f172a;
      margin-top: 4px;
    }
    .main {
      position: relative;
      padding: 18px 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title-block h1 {
      margin: 4px 0 4px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .title-block .sub {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
      max-width: 520px;
    }
    .hero-logos {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }
    .fs-btn {
      border: 1px solid var(--stroke);
      background: #0f172a;
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.15);
      transition: transform .08s ease, box-shadow .12s ease, background .12s;
    }
    .fs-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.2);
      background: #111c33;
    }
    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.2px;
      border: 1px solid transparent;
    }
    .badge.live-active {
      background: #e8fff1;
      color: #15803d;
      border-color: #c0f3d4;
    }
    .badge.live-idle {
      background: #fff7ed;
      color: #b45309;
      border-color: #fdba74;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stage {
      flex: 1;
      min-height: 420px;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    #videoWrap {
      position: relative;
      width: min(1220px, 100%);
      aspect-ratio: 16 / 9;
      max-height: 72vh;
      min-height: 420px;
      background: #f8fafc;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.12);
      border: 1px solid var(--stroke);
    }
    video {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: #000;
      object-fit: cover;
      display: block;
    }
    canvas.overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 18px;
      background: transparent;
    }
    .context-menu {
      position: absolute;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      padding: 8px 0;
      min-width: 180px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.15);
      display: none;
      z-index: 50;
      border: 1px solid var(--stroke);
    }
    .context-menu button {
      width: 100%;
      background: transparent;
      border: none;
      color: #0f172a;
      text-align: left;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .context-menu button:hover { background: #f1f5f9; }
    @media (max-width: 1100px) {
      body {
        overflow-y: auto;
      }
      .layout {
        grid-template-columns: 1fr;
      }
      body.sidebar-collapsed .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        width: 320px;
        max-width: 90vw;
        position: fixed;
        inset: 0 auto 0 0;
        border-right: 1px solid var(--stroke);
        box-shadow: 12px 0 40px rgba(0,0,0,0.4);
      }
      .sidebar__scroll {
        height: calc(100vh - 80px);
      }
      .main {
        padding: 16px;
        overflow: visible;
      }
      #videoWrap {
        width: 100%;
        max-height: 64vh;
        min-height: 360px;
      }
    }
    @media (max-width: 640px) {
      .actions {
        grid-template-columns: 1fr;
      }
      .topbar {
        align-items: flex-start;
      }
      .title-block h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar__header">
      <div class="gov-logos">
        <img class="gov-logo"
             src="{% static 'img/Official-Logo-1.png' %}"
             alt="Bulacan Seal"
             onerror='this.onerror=null; this.src="{% static "img/bulacan-placeholder.svg" %}";'>
        <img class="gov-logo"
             src="{% static 'img/peoples-agenda-e1636598233282.png' %}"
             alt="People's Agenda Seal"
             onerror='this.onerror=null; this.src="{% static "img/peoples-agenda-placeholder.svg" %}";'>
      </div>
      <h2>Face Recognition System</h2>
    </div>

    <div class="sidebar__scroll">
      <div class="controls">
        <div class="tip" data-tip="Pangalan ng empleyado na ie-enroll">
          <label for="label">Employee Name</label>
          <input id="label" placeholder="Employee Name">
        </div>
        <div class="tip" data-tip="Pumili ng camera (auto detects kapag naka-plug in)">
          <label for="cameraSelect">Camera</label>
          <select id="cameraSelect">
            <option value="">Default / Auto</option>
          </select>
        </div>
        <div class="tip" data-tip="Pumili ng opisina o magdagdag ng bago">
          <label for="officeSelect">Office</label>
          <select id="officeSelect">
            <option value="">Select office</option>
            <option value="__new">+ Add new office</option>
          </select>
          <input id="officeCustom" placeholder="New office name" style="display:none; margin-top:8px;">
        </div>
        <div class="tip" data-tip="Ilang larawan ang kokolektahin para sa training">
          <label for="count">Samples</label>
          <input id="count" type="number" value="5" min="1" max="20">
        </div>
        <div class="tip" data-tip="Mas mababa = mas aggressive sa match; default 80">
          <label for="threshold">Threshold</label>
          <input id="threshold" type="number" value="80">
        </div>
      </div>

      <div class="actions">
        <button id="autoEnrollBtn" class="btn primary tip" data-tip="Kukuha ng sample shots at ise-save para sa empleyado">Auto-Enroll</button>
        <button id="updateProfileBtn" class="btn accent tip" data-tip="Gamitin ang kasalukuyang frame bilang bagong profile photo">Update Profile</button>
        <button id="trainBtn" class="btn success tip" data-tip="I-retrain ang model gamit ang pinakabagong samples">Train Model</button>
        <button id="toggleLiveBtn" class="btn live tip" data-tip="Simulan o ihinto ang live recognition feed">Start Live</button>
        <button id="downloadAttendance" class="btn warn tip" data-tip="I-download ang attendance CSV">Download Attendance</button>
      </div>

      <div class="admin-row">
        <a href="/admin-panel/" target="_blank" rel="noopener" class="btn ghost tip" data-tip="Buksan ang admin view para sa offices, employees, at logs" style="width:auto; display:inline-flex; align-items:center; justify-content:center;">
          Open Admin Panel
        </a>
      </div>

      <div id="log" class="log">Ready.</div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title-block">
        <p class="eyebrow">Live feed</p>
        <h1>Face Recognition System</h1>
        <p class="sub">Enroll, train, and monitor attendance with live recognition.</p>
      </div>
      <div class="top-actions" style="gap:14px;">
        <div class="hero-logos">
          <img class="hero-logo"
               src="{% static 'img/Official-Logo-1.png' %}"
               alt="Bulacan Seal"
               onerror='this.onerror=null; this.src="{% static "img/bulacan-placeholder.svg" %}";'>
          <img class="hero-logo"
               src="{% static 'img/peoples-agenda-e1636598233282.png' %}"
               alt="People's Agenda Seal"
               onerror='this.onerror=null; this.src="{% static "img/peoples-agenda-placeholder.svg" %}";'>
        </div>
        <button id="fullscreenBtn" class="fs-btn" type="button">Fullscreen</button>
        <span id="liveIndicator" class="badge live-idle">Stopped</span>
      </div>
    </div>

    <div class="stage">
      <div id="videoWrap">
        <video id="cam" autoplay playsinline></video>
        <canvas id="overlay" class="overlay"></canvas>
      </div>
    </div>
  </main>
</div>

<div id="officeMenu" class="context-menu">
  <button id="deleteOfficeAction" type="button">Delete office</button>
  <button id="renameOfficeAction" type="button">Rename office</button>
</div>

<script>
const cam = document.getElementById('cam');
const overlay = document.getElementById('overlay');
const logEl = document.getElementById('log');
const cameraSelect = document.getElementById('cameraSelect');
const officeSelect = document.getElementById('officeSelect');
const officeCustom = document.getElementById('officeCustom');
const officeMenu = document.getElementById('officeMenu');
const deleteOfficeAction = document.getElementById('deleteOfficeAction');
const renameOfficeAction = document.getElementById('renameOfficeAction');
const updateProfileBtn = document.getElementById('updateProfileBtn');
const sidebar = document.getElementById('sidebar');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const liveIndicator = document.getElementById('liveIndicator');
let hoverSidebar = false;
let collapseTimer = null;
let liveInterval = null;
let busy = false;
let liveActive = false;
let camReady = false;
let camStream = null;

function setSidebar(open) {
  const isCollapsed = document.body.classList.contains('sidebar-collapsed');
  if (open === !isCollapsed) return;
  document.body.classList.toggle('sidebar-collapsed', !open);
  if (!open) {
    officeMenu.style.display = "none";
  }
  setTimeout(syncOverlay, 250);
}

sidebar.addEventListener('mouseenter', () => {
  hoverSidebar = true;
  clearTimeout(collapseTimer);
  setSidebar(true);
});
sidebar.addEventListener('mouseleave', () => {
  hoverSidebar = false;
  scheduleCollapse();
});

function scheduleCollapse() {
  clearTimeout(collapseTimer);
  collapseTimer = setTimeout(() => {
    if (!hoverSidebar) setSidebar(false);
  }, 600);
}

document.addEventListener('mousemove', (e) => {
  if (e.clientX < 40) {
    setSidebar(true);
  } else if (e.clientX > 260 && !hoverSidebar) {
    scheduleCollapse();
  }
});

function isFullscreen() {
  return document.fullscreenElement === document.getElementById('videoWrap');
}

function syncFsButton() {
  fullscreenBtn.textContent = isFullscreen() ? "Exit Fullscreen" : "Fullscreen";
}

async function toggleFullscreen() {
  const wrap = document.getElementById('videoWrap');
  try {
    if (!isFullscreen()) {
      await wrap.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    console.warn("Fullscreen not available", e);
  } finally {
    syncFsButton();
    setTimeout(syncOverlay, 150);
  }
}

fullscreenBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  syncFsButton();
  setTimeout(syncOverlay, 150);
});

async function startCamera(){
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
  try {
    const deviceId = (cameraSelect.value || "").trim();
    const constraints = deviceId ? { video: { deviceId: { exact: deviceId } } } : { video: true };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    camStream = stream;
    cam.srcObject = camStream;
    await cam.play();
    camReady = true;
    syncOverlay();
  } catch (e) {
    log('Camera error: ' + e);
    console.error(e);
  }
}

function syncOverlay() {
  const rect = cam.getBoundingClientRect();
  overlay.width = cam.videoWidth || rect.width || 640;
  overlay.height = cam.videoHeight || rect.height || 480;
  overlay.style.width = rect.width + "px";
  overlay.style.height = rect.height + "px";
}

cam.addEventListener('loadedmetadata', () => {
  camReady = true;
  syncOverlay();
});
window.addEventListener('resize', syncOverlay);

async function loadCameras() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videos = devices.filter(d => d.kind === "videoinput");
    const current = cameraSelect.value || localStorage.getItem("selectedCameraId") || "";
    cameraSelect.innerHTML = '<option value="">Default / Auto</option>';
    videos.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d.deviceId;
      opt.textContent = d.label || `Camera ${cameraSelect.length}`;
      cameraSelect.appendChild(opt);
    });
    if (current && [...cameraSelect.options].some(o => o.value === current)) {
      cameraSelect.value = current;
    }
  } catch (err) {
    console.warn("Unable to enumerate cameras", err);
  }
}

cameraSelect.addEventListener("change", () => {
  localStorage.setItem("selectedCameraId", cameraSelect.value);
  startCamera();
});

if (navigator.mediaDevices) {
  navigator.mediaDevices.addEventListener("devicechange", loadCameras);
}

function log(msg){
  logEl.textContent = typeof msg === "string" ? msg : JSON.stringify(msg,null,2);
}

async function loadOffices(){
  try {
    const res = await fetch("/offices/");
    const data = await res.json();
    if (data.ok && Array.isArray(data.offices)) {
      const selected = officeSelect.value;
      officeSelect.innerHTML = "";
      const opts = [{ value: "", label: "Select office" }]
        .concat(data.offices.map(o => ({ value: o, label: o })))
        .concat({ value: "__new", label: "+ Add new office" });

      opts.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.value;
        opt.textContent = item.label;
        officeSelect.appendChild(opt);
      });
      if ([...officeSelect.options].some(o => o.value === selected)) {
        officeSelect.value = selected;
      }
      toggleCustomOffice();
    }
  } catch (e) {
    console.warn("Unable to load offices", e);
  }
}

function toggleCustomOffice() {
  if (officeSelect.value === "__new") {
    officeCustom.style.display = "block";
    officeCustom.focus();
  } else {
    officeCustom.style.display = "none";
  }
}

officeSelect.addEventListener("change", toggleCustomOffice);
officeSelect.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const val = officeSelect.value;
  if (!val || val === "__new") return;
  officeMenu.style.display = "block";
  officeMenu.style.top = `${e.clientY + window.scrollY + 6}px`;
  officeMenu.style.left = `${e.clientX + window.scrollX + 6}px`;
});

document.addEventListener("click", (e) => {
  if (!officeMenu.contains(e.target) && e.target !== officeSelect) {
    officeMenu.style.display = "none";
  }
});

function resolveOfficeValue() {
  if (officeSelect.value === "__new") {
    return officeCustom.value.trim();
  }
  return officeSelect.value.trim();
}

function snapshot(){
  const width = cam.videoWidth || cam.offsetWidth;
  const height = cam.videoHeight || cam.offsetHeight;
  if (!camReady || !width || !height) return null;
  const c = document.createElement('canvas');
  c.width = width;
  c.height = height;
  c.getContext('2d').drawImage(cam,0,0,width,height);
  return c.toDataURL("image/jpeg");
}

function getCsrfToken(){
  const cookie = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith('csrftoken='));
  return cookie ? decodeURIComponent(cookie.split('=')[1]) : '';
}

async function postJSON(url, data){
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type":"application/json",
      "X-CSRFToken": getCsrfToken()
    },
    body: JSON.stringify(data)
  });
  return res.json();
}

function getThresholdValue() {
  const raw = document.getElementById('threshold').value;
  const num = parseFloat(raw);
  if (Number.isFinite(num)) return num;
  return 80;
}

document.getElementById('autoEnrollBtn').addEventListener('click', async () => {
  const label = document.getElementById('label').value.trim();
  const office = resolveOfficeValue();
  const count = parseInt(document.getElementById('count').value || 5, 10);
  if (!label) return alert("Enter name");
  if (!office) return alert("Enter office");
  if (!camReady) return alert("Camera not ready yet. Please wait a moment.");

  for (let i=0;i<count;i++){
    const img = snapshot();
    if (!img) {
      log("Camera not ready to capture images yet.");
      break;
    }
    const res = await postJSON("/enroll/", {label, office, image: img});
    log(`Saved ${i+1}/${count}: ${JSON.stringify(res)}`);
    await new Promise(r=>setTimeout(r,500));
  }
  log("Auto enroll done - train model next!");
  loadOffices();
});

updateProfileBtn.addEventListener('click', async () => {
  const label = document.getElementById('label').value.trim();
  const office = resolveOfficeValue();
  if (!label) return alert("Enter name");
  if (!office) return alert("Enter office");
  if (!camReady) return alert("Camera not ready yet. Please wait a moment.");

  const img = snapshot();
  if (!img) return alert("Camera not ready to capture images yet.");

  const res = await postJSON("/profile/update/", { label, office, image: img });
  if (!res || !res.ok) {
    log(res && res.error ? res.error : "Unable to update profile.");
    return;
  }
  log(`Profile updated: ${res.saved}`);
  loadOffices();
});

deleteOfficeAction.addEventListener('click', async () => {
  officeMenu.style.display = "none";
  const office = officeSelect.value;
  if (!office || office === "__new") return;
  const sure = confirm(`Remove office "${office}"? This will delete its training data and attendance rows.`);
  if (!sure) return;
  try {
    const res = await fetch("/offices/delete/", {
      method: "POST",
      headers: {
        "Content-Type":"application/json",
        "X-CSRFToken": getCsrfToken()
      },
      body: JSON.stringify({ office })
    });
    const data = await res.json();
    if (!data.ok) {
      alert(data.error || "Unable to delete office.");
      return;
    }
    log(`Office "${office}" removed.`);
    officeSelect.value = "";
    officeCustom.value = "";
    toggleCustomOffice();
    loadOffices();
  } catch (e) {
    alert("Error deleting office. See console for details.");
    console.error(e);
  }
});

renameOfficeAction.addEventListener('click', async () => {
  officeMenu.style.display = "none";
  const office = officeSelect.value;
  if (!office || office === "__new") return;
  const next = prompt(`Rename office "${office}" to:`, office);
  if (!next) return;
  const newName = next.trim();
  if (!newName || newName === office) return;
  try {
    const res = await fetch("/offices/rename/", {
      method: "POST",
      headers: {
        "Content-Type":"application/json",
        "X-CSRFToken": getCsrfToken()
      },
      body: JSON.stringify({ old: office, new: newName })
    });
    const data = await res.json();
    if (!data.ok) {
      alert(data.error || "Unable to rename office.");
      return;
    }
    log(`Office renamed to "${newName}".`);
    officeSelect.value = newName;
    officeCustom.value = "";
    toggleCustomOffice();
    loadOffices();
  } catch (e) {
    alert("Error renaming office. See console for details.");
    console.error(e);
  }
});

document.getElementById('trainBtn').addEventListener('click', async () => {
  log("Training...");
  log(await postJSON("/train/", {}));
});

document.getElementById('downloadAttendance').addEventListener('click', () => {
  window.location.href = "/download_attendance/";
});

document.getElementById('toggleLiveBtn').addEventListener('click', () => {
  if (liveInterval){ stopLive(); }
  else { startLive(); }
});

function startLive(){
  if (liveInterval) return;
  document.getElementById('toggleLiveBtn').textContent = "Stop Live";
  liveInterval = setInterval(liveTick, 800);
  liveActive = true;
  syncLiveIndicator();
}

function stopLive(){
  clearInterval(liveInterval);
  liveInterval = null;
  document.getElementById('toggleLiveBtn').textContent = "Start Live";
  clearOverlay();
  liveActive = false;
  syncLiveIndicator();
}

async function liveTick(){
  if (busy) return;
  busy = true;
  try {
    const img = snapshot();
    if (!img) {
      log("Camera not ready for live feed yet.");
      return;
    }
    const res = await postJSON("/recognize/", {
      image: img,
      threshold: getThresholdValue()
    });
    drawResults(res.results || []);
  } catch (e) {
    console.error("Live tick failed", e);
    log("Live error: " + (e && e.message ? e.message : e));
    clearOverlay();
  } finally {
    busy = false;
  }
}

function clearOverlay(){
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0,0,overlay.width,overlay.height);
}

function drawResults(results){
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0,0,overlay.width,overlay.height);
  ctx.lineWidth = 2;
  ctx.font = "16px Manrope, Segoe UI";

  results.forEach(r => {
    const [x,y,w,h] = r.bbox;
    ctx.strokeStyle = r.matched ? "#22c55e" : "#f97316";
    ctx.strokeRect(x,y,w,h);

    const text = `${r.name} (${r.confidence.toFixed(1)})`;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    const tw = ctx.measureText(text).width;
    ctx.fillRect(x, y-26, tw + 10, 22);
    ctx.fillStyle = "white";
    ctx.fillText(text, x+5, y-10);
  });
}

function syncLiveIndicator() {
  if (!liveIndicator) return;
  const isLive = !!liveInterval;
  liveIndicator.textContent = isLive ? "Live" : "Stopped";
  liveIndicator.classList.toggle('live-active', isLive);
  liveIndicator.classList.toggle('live-idle', !isLive);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && liveActive && !liveInterval) {
    startLive();
  }
  syncLiveIndicator();
});

setSidebar(false);
syncFsButton();
loadCameras().then(startCamera);
loadOffices();
syncLiveIndicator();
</script>
